# Synthetic workloads for a managed Kubernetes cluster (no real data).
---
apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
apiVersion: v1
kind: Namespace
metadata: {name: kube-system}
---
apiVersion: v1
kind: Namespace
metadata: {name: ingress-nginx}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: coredns, namespace: kube-system}
spec:
  replicas: 2
  selector: {matchLabels: {app: coredns}}
  template:
    metadata: {labels: {app: coredns}}
    spec:
      nodeSelector: {kubernetes.azure.com/agentpool: system}
      tolerations: [{key: CriticalAddonsOnly, operator: Exists}]
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.11.1
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 250m, memory: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ingress-nginx-controller, namespace: ingress-nginx}
spec:
  replicas: 2
  selector: {matchLabels: {app: ingress-nginx-controller}}
  template:
    metadata: {labels: {app: ingress-nginx-controller}}
    spec:
      nodeSelector: {workload: general}
      containers:
        - name: ingress-nginx-controller
          image: registry.k8s.io/ingress-nginx/controller:v1.11.1
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 250m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: ingress-nginx-controller, namespace: ingress-nginx}
spec: {selector: {app: ingress-nginx-controller}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: shop}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      nodeSelector: {workload: general}
      containers:
        - name: web
          image: registry.example.com/shop/web:2.4.1
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 250m, memory: 256Mi}}
          envFrom: [{configMapRef: {name: shop-cfg}}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: shop}
spec: {selector: {app: web}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: shop}
spec:
  replicas: 3
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      serviceAccountName: api
      nodeSelector: {workload: general}
      containers:
        - name: api
          image: registry.example.com/shop/api:2.4.1
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 250m, memory: 256Mi}}
          envFrom: [{configMapRef: {name: shop-cfg}}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: shop}
spec: {selector: {app: api}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: shop}
spec:
  replicas: 4
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      nodeSelector: {workload: batch}
      tolerations: [{key: batch, operator: Exists}]
      containers:
        - name: worker
          image: registry.example.com/shop/worker:2.4.1
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 250m, memory: 256Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: report, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: report}}
  template:
    metadata: {labels: {app: report}}
    spec:
      containers:
        - name: report
          image: registry.example.com/shop/report:1.9.0
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 250m, memory: 256Mi}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: shop-cfg, namespace: shop}
data: {k: v}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: shop, namespace: shop}
spec:
  ingressClassName: nginx
  rules:
    - host: shop.example.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
          - {path: /api, pathType: Prefix, backend: {service: {name: api, port: {number: 80}}}}
