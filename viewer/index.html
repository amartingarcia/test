<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>infra-diagram viewer</title>
<script src="https://unpkg.com/cytoscape@3.30.1/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
<script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>
<script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<script src="https://unpkg.com/cytoscape-expand-collapse@4.1.1/cytoscape-expand-collapse.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --vpc: #3fb950;
    --eks: #d2a8ff;
    --net: #f0883e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; }
  #app { display: flex; height: 100vh; }
  #graph { flex: 1; min-width: 0; }
  #sidebar { width: 340px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; }
  #topbar { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; align-items: center; }
  select, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  h2 { font-size: 14px; margin: 0 0 4px; color: var(--accent); }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 16px 0 6px; }
  .kind { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
  .empty { color: var(--muted); font-size: 13px; margin-top: 40px; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 4px 0; vertical-align: top; border-bottom: 1px solid var(--border); }
  td.key { color: var(--muted); width: 40%; padding-right: 8px; font-family: ui-monospace, monospace; }
  td.val { word-break: break-word; }
  .unresolved { color: #f0883e; font-style: italic; }
  .raw { font-family: ui-monospace, monospace; white-space: pre-wrap; font-size: 11px; color: var(--muted); }
  .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; }
  .badge.vpc { background: rgba(63,185,80,.15); color: var(--vpc); }
  .badge.eks { background: rgba(210,168,255,.15); color: var(--eks); }
  .badge.net { background: rgba(240,136,62,.15); color: var(--net); }
  #coverage { position: absolute; bottom: 12px; left: 12px; z-index: 10; font-size: 11px; color: var(--muted); max-width: 400px; }
</style>
</head>
<body>
<div id="app">
  <div id="graph">
    <div id="topbar">
      <select id="env-select"></select>
      <button id="fit-btn">Fit</button>
      <button id="expand-all-btn">Expand all</button>
      <button id="collapse-all-btn">Collapse all</button>
    </div>
    <div id="coverage"></div>
  </div>
  <div id="sidebar">
    <div class="empty">Click a node to see its details.</div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
