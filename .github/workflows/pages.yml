name: Deploy viewer to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "viewer/**"
      - "scripts/export-html.mjs"
      - "scripts/lib/standalone-*"
      - "scripts/lib/build-standalone.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the standalone single-file HTML (all sample environments, offline)
        run: node scripts/export-html.mjs --out viewer/infra-diagram.html
      - name: Upload viewer/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "viewer"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
